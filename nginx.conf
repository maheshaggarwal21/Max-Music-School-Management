# nginx.conf — MaxMusic Platform
# Deploy steps:
#   1. Replace <PLATFORM_DOMAIN> and <OPERATOR_DOMAIN> with real values.
#   2. Run: certbot --nginx -d <PLATFORM_DOMAIN> -d api.<PLATFORM_DOMAIN> -d <OPERATOR_DOMAIN>
#      (certbot will fill in the ssl_certificate paths automatically)
#   3. Reload: nginx -s reload

# ── Upstreams ─────────────────────────────────────────────────────────────────
upstream api             { server 127.0.0.1:4000; keepalive 16; }
upstream operator_panel  { server 127.0.0.1:3000; keepalive 8; }
upstream admin_panel     { server 127.0.0.1:3001; keepalive 8; }
upstream teacher_panel   { server 127.0.0.1:3002; keepalive 8; }
upstream student_panel   { server 127.0.0.1:3003; keepalive 8; }

# ── Shared proxy headers macro ────────────────────────────────────────────────
# (nginx map / geo blocks go here if needed in future)

# ─────────────────────────────────────────────────────────────────────────────
# HTTP → HTTPS redirects (all three server names)
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name <PLATFORM_DOMAIN> api.<PLATFORM_DOMAIN>;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name <OPERATOR_DOMAIN>;
    server_tokens off;
    return 301 https://$host$request_uri;
}

# ─────────────────────────────────────────────────────────────────────────────
# PLATFORM_DOMAIN — institution panels (admin / teacher / student)
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name <PLATFORM_DOMAIN>;
    server_tokens off;

    # TLS — filled in by certbot
    ssl_certificate     /etc/letsencrypt/live/<PLATFORM_DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<PLATFORM_DOMAIN>/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"           always;
    add_header X-Content-Type-Options    "nosniff"              always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # CSP: allow same origin + the API subdomain for fetch; no inline scripts in Next.js SSR.
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://api.<PLATFORM_DOMAIN> wss://api.<PLATFORM_DOMAIN>; font-src 'self' data:; frame-ancestors 'none';" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Admin panel: /<slug>/admin/...
    location ~* ^/[^/]+/admin(/|$) {
        proxy_pass         http://admin_panel;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }

    # Teacher panel: /<slug>/teacher/...
    location ~* ^/[^/]+/teacher(/|$) {
        proxy_pass         http://teacher_panel;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }

    # Student panel: /<slug>/student/...
    location ~* ^/[^/]+/student(/|$) {
        proxy_pass         http://student_panel;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }

    # Everything else on the platform domain is not a valid path.
    location / {
        return 404;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# API subdomain — Express backend + Socket.io WebSocket upgrade
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.<PLATFORM_DOMAIN>;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/<PLATFORM_DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<PLATFORM_DOMAIN>/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options        "DENY"   always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    client_max_body_size 10m;  # S3 pre-sign flow — bodies are small; increase if needed

    # Socket.io long-polling + WebSocket upgrade.
    # Must come BEFORE the generic / block so the regex is evaluated first.
    location ~* ^/socket\.io/ {
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket upgrade headers
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 86400s;  # keep socket alive
        proxy_send_timeout 86400s;
    }

    # All other API traffic
    location / {
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# OPERATOR_DOMAIN — private superadmin panel (separate domain, not linked publicly)
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name <OPERATOR_DOMAIN>;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/<OPERATOR_DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<OPERATOR_DOMAIN>/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options           "DENY"    always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # Tight CSP for the operator panel — no external resources, no framing.
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.<PLATFORM_DOMAIN>; font-src 'self' data:; frame-ancestors 'none';" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        proxy_pass         http://operator_panel;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }
}

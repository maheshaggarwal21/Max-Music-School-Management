# nginx.conf — MaxMusic Platform
# Replace <PLATFORM_DOMAIN> and <OPERATOR_DOMAIN> with real values at deploy time.
# Phase 8: uncomment HTTPS blocks and add Let's Encrypt certs.

upstream api             { server 127.0.0.1:4000; keepalive 16; }
upstream operator_panel  { server 127.0.0.1:3000; keepalive 8; }
upstream admin_panel     { server 127.0.0.1:3001; keepalive 8; }
upstream teacher_panel   { server 127.0.0.1:3002; keepalive 8; }
upstream student_panel   { server 127.0.0.1:3003; keepalive 8; }

# ── Institution panels — path-regex routing on PLATFORM_DOMAIN ───────────────
server {
    listen 80;
    server_name <PLATFORM_DOMAIN>;

    # Phase 8: enable HTTPS redirect
    # return 301 https://$host$request_uri;

    server_tokens off;

    # Admin panel: /<slug>/admin/...
    location ~* ^/[^/]+/admin(/|$) {
        proxy_pass         http://admin_panel;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # Teacher panel: /<slug>/teacher/...
    location ~* ^/[^/]+/teacher(/|$) {
        proxy_pass         http://teacher_panel;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # Student panel: /<slug>/student/...
    location ~* ^/[^/]+/student(/|$) {
        proxy_pass         http://student_panel;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # Deny everything else on the platform domain
    location / {
        return 404;
    }
}

# ── Operator panel — private domain ──────────────────────────────────────────
server {
    listen 80;
    server_name <OPERATOR_DOMAIN>;

    # Phase 8: enable HTTPS redirect
    # return 301 https://$host$request_uri;

    server_tokens off;

    location / {
        proxy_pass         http://operator_panel;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }
}

# ── API ───────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.<PLATFORM_DOMAIN>;

    # Phase 8: enable HTTPS redirect
    # return 301 https://$host$request_uri;

    server_tokens off;

    location / {
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }
}

